name: Auto Link Builder and Cleaner
concurrency:
  group: plant-matrix-site-updates
  cancel-in-progress: false
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Crucial for pulling/rebasing history safely

    - name: Set up Python environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Execute Link Rebuilder
      run: python auto_linker.py

    - name: Commit and Push Clean Files Safely
      shell: bash
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # Stage all changes created by the python script
        git add -A
        
        # Check if any cleanup actually occurred
        if ! git diff --cached --quiet; then
          git commit -m "System automatic mass cleanup of all duplicate recommendation blocks [skip ci]"
          
          # Force rebase to slide changes cleanly on top of the sitemap workflow pushes
          git pull origin main --rebase
          git push origin main
        else
          echo "No cleanup changes detected. Skipping push."
        fi
