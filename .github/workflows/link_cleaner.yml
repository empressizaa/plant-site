name: Auto Link Builder and Cleaner

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Execute Link Rebuilder
      run: python auto_linker.py

    - name: Commit and Push Clean Files
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "System automatic mass cleanup of all duplicate recommendation blocks"
