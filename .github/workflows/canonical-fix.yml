name: Manual and Automated Canonical Patch
concurrency:
  group: plant-matrix-site-updates
  cancel-in-progress: false
on:
  push:
    branches:
      - main
  workflow_dispatch: # Keeps the manual play button active in the Actions dashboard

jobs:
  patch-links:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Ensures the workflow has permission to push back to the repository

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Crucial for pulling/rebasing history safely

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Auto-Canonical Script
        run: python auto_canonical.py

      - name: Commit Fixed Tags Safely
        shell: bash
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage all modified HTML files
          git add *.html
          
          # Check if changes exist to avoid empty commits
          if ! git diff --cached --quiet; then
            git commit -m "Safe patch changing example.com to real domains [skip ci]"
            
            # Fetch and rebase right before pushing to eliminate the non-fast-forward race condition
            git pull origin main --rebase
            git push origin main
          else
            echo "No canonical tag updates detected. Skipping push."
          fi
