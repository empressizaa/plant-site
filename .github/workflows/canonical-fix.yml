name: Manual and Automated Canonical Patch
concurrency:
  group: plant-matrix-site-updates
  cancel-in-progress: false
on:
  push:
    branches:
      - main
  workflow_dispatch: # Keeps the manual play button active in the Actions dashboard

jobs:
  patch-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Auto-Canonical Script
        run: python auto_canonical.py

      - name: Commit Fixed Tags
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add *.html
          # Adding [skip ci] inside the message tells GitHub NOT to trigger a loop!
          git diff --quiet && git diff --staged --quiet || (git commit -m "Safe patch changing example.com to real domains [skip ci]" && git push origin main) 
