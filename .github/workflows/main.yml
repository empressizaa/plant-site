name: Plant Matrix Unified Site Updates

concurrency:
  group: plant-matrix-site-updates
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    paths-ignore:
      - sitemap.xml
      - index.html
      - feed.xml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. CHECKOUT REPOSITORY
      # --------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # 2. SETUP PYTHON
      # --------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # --------------------------------------------------
      # 3. MOVE CALCULATORS FROM /tools/ TO ROOT
      # --------------------------------------------------
      - name: Move Calculators To Root
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p tools

          move_if_needed() {
            SOURCE="$1"
            DESTINATION="$2"

            if [ -f "$SOURCE" ]; then
              if [ -f "$DESTINATION" ]; then
                echo "Root file already exists:"
                echo "  $DESTINATION"
                echo "Removing duplicate tools version:"
                echo "  $SOURCE"
                rm -f "$SOURCE"
              else
                echo "Moving:"
                echo "  $SOURCE"
                echo "to:"
                echo "  $DESTINATION"
                mv "$SOURCE" "$DESTINATION"
              fi
            else
              echo "Not found, skipping:"
              echo "  $SOURCE"
            fi
          }

          move_if_needed \
            "tools/lawn-fertilizer-calculator.html" \
            "lawn-fertilizer-calculator.html"

          move_if_needed \
            "tools/plant-population-density-calculator.html" \
            "plant-population-density-calculator.html"

          move_if_needed \
            "tools/plant-spacing-calculator.html" \
            "plant-spacing-calculator.html"

          move_if_needed \
            "tools/rainwater-collection-calculator.html" \
            "rainwater-collection-calculator.html"

          move_if_needed \
            "tools/raised-bed-garden-soil-calculator.html" \
            "raised-bed-garden-soil-calculator.html"

          echo ""
          echo "Calculator move completed."

      # --------------------------------------------------
      # 4. DELETE ALL OLD HTML FILES
      #    KEEP ONLY INDEX + 5 ROOT CALCULATORS
      # --------------------------------------------------
      - name: Remove Old Article HTML Files
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          protected = {
              Path("index.html"),
              Path("lawn-fertilizer-calculator.html"),
              Path("plant-population-density-calculator.html"),
              Path("plant-spacing-calculator.html"),
              Path("rainwater-collection-calculator.html"),
              Path("raised-bed-garden-soil-calculator.html"),
          }

          print("Checking HTML files...")
          print("")

          for file in Path(".").rglob("*.html"):
              if ".git" in file.parts:
                  continue

              if file in protected:
                  print(f"KEEP: {file}")
              else:
                  print(f"DELETE: {file}")
                  file.unlink()

          print("")
          print("Verifying protected files...")

          missing = False

          for file in sorted(protected):
              if file.exists():
                  print(f"KEEP: {file}")
              else:
                  print(f"ERROR: Protected file missing: {file}")
                  missing = True

          if missing:
              raise SystemExit(1)

          print("")
          print("HTML cleanup completed successfully.")
          PY

      # --------------------------------------------------
      # 5. RUN AUTO CANONICAL SCRIPT
      # --------------------------------------------------
      - name: Run Auto-Canonical Script
        shell: bash
        run: |
          if [ -f auto_canonical.py ]; then
            python auto_canonical.py
          else
            echo "auto_canonical.py not found, skipping."
          fi

      # --------------------------------------------------
      # 6. RUN AUTO LINK REBUILDER
      # --------------------------------------------------
      - name: Execute Link Rebuilder
        shell: bash
        run: |
          if [ -f auto_linker.py ]; then
            python auto_linker.py
          else
            echo "auto_linker.py not found, skipping."
          fi

      # --------------------------------------------------
      # 7. UPDATE HOMEPAGE
      #    KEEP ONLY THE 5 CALCULATORS
      # --------------------------------------------------
      - name: Update Homepage Calculator Links
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          index = Path("index.html")

          if not index.exists():
              raise SystemExit("ERROR: index.html not found")

          content = index.read_text(encoding="utf-8")

          calculators = [
              (
                  "/lawn-fertilizer-calculator",
                  "Lawn Fertilizer Calculator"
              ),
              (
                  "/plant-population-density-calculator",
                  "Plant Population Density Calculator"
              ),
              (
                  "/plant-spacing-calculator",
                  "Plant Spacing Calculator"
              ),
              (
                  "/rainwater-collection-calculator",
                  "Rainwater Collection Calculator"
              ),
              (
                  "/raised-bed-garden-soil-calculator",
                  "Raised Bed Garden Soil Calculator"
              ),
          ]

          start_marker = "<!-- START_ARTICLE_LIST -->"
          end_marker = "<!-- END_ARTICLE_LIST -->"

          if start_marker not in content:
              raise SystemExit(
                  "ERROR: START_ARTICLE_LIST marker not found in index.html"
              )

          if end_marker not in content:
              raise SystemExit(
                  "ERROR: END_ARTICLE_LIST marker not found in index.html"
              )

          links = []

          for url, title in calculators:
              file_name = url.lstrip("/") + ".html"

              if not Path(file_name).exists():
                  raise SystemExit(
                      f"ERROR: Calculator file missing: {file_name}"
                  )

              links.append(
                  f'    <li><a href="{url}">{title}</a></li>'
              )

          calculator_links = "\n".join(links)

          start = content.index(start_marker)
          end = content.index(end_marker)

          before = content[:start + len(start_marker)]
          after = content[end:]

          new_content = (
              before
              + "\n"
              + calculator_links
              + "\n"
              + after
          )

          index.write_text(new_content, encoding="utf-8")

          print("Homepage updated successfully.")
          print("")
          print("Homepage calculators:")

          for _, title in calculators:
              print(f"- {title}")
          PY

      # --------------------------------------------------
      # 8. GENERATE CLEAN SITEMAP
      # --------------------------------------------------
      - name: Generate Sitemap
        shell: bash
        run: |
          set -euo pipefail

          TODAY="$(date -u +'%Y-%m-%d')"

          {
            printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>'
            printf '%s\n' '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'

            printf '%s\n' '  <url>'
            printf '%s\n' '    <loc>https://theplantmatrix.com/</loc>'
            printf '    <lastmod>%s</lastmod>\n' "$TODAY"
            printf '%s\n' '    <changefreq>daily</changefreq>'
            printf '%s\n' '    <priority>1.0</priority>'
            printf '%s\n' '  </url>'
          } > sitemap.xml

          for file in \
            lawn-fertilizer-calculator.html \
            plant-population-density-calculator.html \
            plant-spacing-calculator.html \
            rainwater-collection-calculator.html \
            raised-bed-garden-soil-calculator.html
          do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing calculator: $file"
              exit 1
            fi

            URL_PATH="${file%.html}"
            LASTMOD="$(date -u -r "$file" +'%Y-%m-%d')"

            {
              printf '%s\n' '  <url>'
              printf '    <loc>https://theplantmatrix.com/%s</loc>\n' "$URL_PATH"
              printf '    <lastmod>%s</lastmod>\n' "$LASTMOD"
              printf '%s\n' '    <changefreq>monthly</changefreq>'
              printf '%s\n' '    <priority>0.8</priority>'
              printf '%s\n' '  </url>'
            } >> sitemap.xml
          done

          printf '%s\n' '</urlset>' >> sitemap.xml

          echo "Sitemap generated successfully."

      # --------------------------------------------------
      # 9. GENERATE RSS FEED
      # --------------------------------------------------
      - name: Run Feed Builder
        shell: bash
        run: |
          if [ -f "generate_feed .py" ]; then
            python "generate_feed .py"
          elif [ -f "generate_feed.py" ]; then
            python generate_feed.py
          else
            echo "RSS script not found, skipping."
          fi

      # --------------------------------------------------
      # 10. VERIFY FINAL FILE STRUCTURE
      # --------------------------------------------------
      - name: Verify Final Site Structure
        shell: bash
        run: |
          set -euo pipefail

          echo "Final HTML files:"
          find . -type f -name "*.html" \
            ! -path "./.git/*" \
            | sort

          echo ""
          echo "Checking protected calculators..."

          for file in \
            lawn-fertilizer-calculator.html \
            plant-population-density-calculator.html \
            plant-spacing-calculator.html \
            rainwater-collection-calculator.html \
            raised-bed-garden-soil-calculator.html
          do
            if [ -f "$file" ]; then
              echo "OK: $file"
            else
              echo "ERROR: Missing $file"
              exit 1
            fi
          done

          echo ""
          echo "Checking index.html..."

          if [ -f index.html ]; then
            echo "OK: index.html"
          else
            echo "ERROR: index.html missing"
            exit 1
          fi

          echo ""
          echo "Site structure verified successfully."

      # --------------------------------------------------
      # 11. COMMIT AND PUSH EVERYTHING
      # --------------------------------------------------
      - name: Commit and Push Changes Safely
        shell: bash
        run: |
          set -euo pipefail

          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Clean old pages and keep calculator tools [skip ci]"

            git pull origin main --rebase

            git push origin main
          else
            echo "No site changes detected. Skipping push."
          fi
