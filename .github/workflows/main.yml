name: Plant Matrix Unified Site Updates
concurrency:
  group: plant-matrix-site-updates
  cancel-in-progress: false
on:
  push:
    branches:
      - main
    paths-ignore:
      - sitemap.xml
      - index.html
      - feed.xml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # ============================================================
      # 2. SETUP PYTHON
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      # ============================================================
      # 3. REMOVE OLD ARTICLE HTML FILES
      #
      # KEEP ONLY:
      #   index.html
      #   lawn-fertilizer-calculator.html
      #   plant-population-density-calculator.html
      #   plant-spacing-calculator.html
      #   rainwater-collection-calculator.html
      #   raised-bed-garden-soil-calculator.html
      #
      # The five calculators may be inside /tools/.
      # ============================================================
      - name: Remove old article HTML files
        shell: bash
        run: |
          set -euo pipefail
          echo "Starting old article cleanup..."
          PROTECTED_FILES=(
            "index.html"
            "lawn-fertilizer-calculator.html"
            "plant-population-density-calculator.html"
            "plant-spacing-calculator.html"
            "rainwater-collection-calculator.html"
            "raised-bed-garden-soil-calculator.html"
          )
          # Delete every HTML file except index.html and protected calculators.
          find . -type f -name "*.html" \
            ! -path "./.git/*" \
            ! -name "index.html" \
            ! -name "lawn-fertilizer-calculator.html" \
            ! -name "plant-population-density-calculator.html" \
            ! -name "plant-spacing-calculator.html" \
            ! -name "rainwater-collection-calculator.html" \
            ! -name "raised-bed-garden-soil-calculator.html" \
            -print -delete
          echo ""
          echo "Verifying protected files..."
          # Check protected files wherever they exist in the repository.
          for filename in "${PROTECTED_FILES[@]}"; do
            if find . -type f -name "$filename" \
              ! -path "./.git/*" | grep -q .; then
              echo "KEEP: $filename"
            else
              echo "WARNING: Protected file not found: $filename"
            fi
          done
          echo ""
          echo "Remaining HTML files:"
          find . -type f -name "*.html" \
            ! -path "./.git/*" \
            -print | sort
      # ============================================================
      # 4. CANONICAL PATCH
      # ============================================================
      - name: Run Auto-Canonical Script
        run: |
          if [ -f auto_canonical.py ]; then
            python auto_canonical.py
          else
            echo "auto_canonical.py not found, skipping."
          fi
      # ============================================================
      # 5. AUTO LINK BUILDER & CLEANER
      # ============================================================
      - name: Execute Link Rebuilder
        run: |
          if [ -f auto_linker.py ]; then
            python auto_linker.py
          else
            echo "auto_linker.py not found, skipping."
          fi
      # ============================================================
      # 6. GENERATE SITEMAP AND HOMEPAGE
      # ============================================================
      - name: Generate sitemap and homepage
        shell: bash
        run: |
          set -euo pipefail
          TODAY="$(date -u +'%Y-%m-%d')"
          {
            printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>'
            printf '%s\n' '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
            printf '%s\n' '  <url>'
            printf '%s\n' '    <loc>https://theplantmatrix.com/</loc>'
            printf '    <lastmod>%s</lastmod>\n' "$TODAY"
            printf '%s\n' '    <changefreq>daily</changefreq>'
            printf '%s\n' '    <priority>1.0</priority>'
            printf '%s\n' '  </url>'
          } > sitemap.xml
          rm -f links.tmp
          touch links.tmp
          find . -type f -name "*.html" \
            ! -name "index.html" \
            ! -path "./.git/*" | sort | while IFS= read -r file
          do
            RELATIVE_PATH="${file#./}"
            URL_PATH="${RELATIVE_PATH%.html}"
            LASTMOD="$(date -u -r "$file" +'%Y-%m-%d')"
            {
              printf '%s\n' '  <url>'
              printf '    <loc>https://theplantmatrix.com/%s</loc>\n' "$URL_PATH"
              printf '    <lastmod>%s</lastmod>\n' "$LASTMOD"
              printf '%s\n' '    <changefreq>monthly</changefreq>'
              printf '%s\n' '    <priority>0.8</priority>'
              printf '%s\n' '  </url>'
            } >> sitemap.xml
            # Add root-level HTML pages to homepage article/tool list.
            if [[ "$RELATIVE_PATH" != */* ]]; then
              FILE="$(basename "$file")"
              TITLE=$(echo "$FILE" \
                | sed 's/\.html$//' \
                | sed 's/-/ /g' \
                | awk '{
                    for(i=1;i<=NF;i++)
                      $i=toupper(substr($i,1,1)) substr($i,2)
                  }1')
              printf '    <li><a href="/%s">%s</a></li>\n' \
                "${FILE%.html}" "$TITLE" >> links.tmp
            fi
          done
          printf '%s\n' '</urlset>' >> sitemap.xml
          # Rebuild homepage article/tool list.
          if [ -f index.html ]; then
            awk '
            /<!-- START_ARTICLE_LIST -->/ {
                print
                while ((getline line < "links.tmp") > 0)
                    print line
                close("links.tmp")
                skip=1
                next
            }
            /<!-- END_ARTICLE_LIST -->/ {
                skip=0
                print
                next
            }
            !skip
            ' index.html > index.new
            mv index.new index.html
          else
            echo "ERROR: index.html is missing."
            exit 1
          fi
          rm -f links.tmp
      # ============================================================
      # 7. RSS FEED
      # ============================================================
      - name: Run Feed Builder
        run: |
          if [ -f "generate_feed .py" ]; then
            python "generate_feed .py"
          elif [ -f generate_feed.py ]; then
            python generate_feed.py
          else
            echo "RSS script not found, skipping."
          fi
      # ============================================================
      # 8. COMMIT AND PUSH EVERYTHING TO MAIN
      # ============================================================
      - name: Commit and Push Changes Safely
        shell: bash
        run: |
          set -euo pipefail
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Clean old articles and rebuild site"
            git pull origin main --rebase
            git push origin main
          else
            echo "No site changes detected. Skipping push."
          fi
