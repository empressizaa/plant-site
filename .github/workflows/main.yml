name: Generate Sitemap

on:
push:
branches:
- main
paths:
- "*.html"
workflow_dispatch:

permissions:
contents: write
,
jobs:
sitemap:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

- name: Generate sitemap.xml
run: |
TODAY=$(date -u +"%Y-%m-%d")
echo '<?xml version="1.0" encoding="UTF-8"?>' > sitemap.xml
echo '<urlset xmlns="http://sitemaps.org">' >> sitemap.xml

# Homepage
echo " <url>" >> sitemap.xml
echo " <loc>https://theplantmatrix.com</loc>" >> sitemap.xml
echo " <lastmod>$TODAY</lastmod>" >> sitemap.xml
echo " <changefreq>daily</changefreq>" >> sitemap.xml
echo " <priority>1.0</priority>" >> sitemap.xml
echo " </url>" >> sitemap.xml

# Article pages
shopt -s nullglob
for file in *.html; do
if [ "$file" != "index.html" ]; then
LASTMOD=$(date -u -r "$file" +"%Y-%m-%d")
echo " <url>" >> sitemap.xml
echo " <loc>https://theplantmatrix.com</loc>" >> sitemap.xml
echo " <lastmod>$LASTMOD</lastmod>" >> sitemap.xml
echo " <changefreq>monthly</changefreq>" >> sitemap.xml
echo " <priority>0.8</priority>" >> sitemap.xml
echo " </url>" >> sitemap.xml
fi
done
echo "</urlset>" >> sitemap.xml

- name: Commit sitemap
run: |
git config user.name "github-actions[bot]"
git config user.email "41898282+github-actions[bot]@://github.com"
git add sitemap.xml
if git diff --cached --quiet; then
echo "No sitemap changes."
exit 0
fi
git commit -m "Auto-update sitemap URLs"
git push origin main
