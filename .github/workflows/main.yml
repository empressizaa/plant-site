name: Plant Matrix Unified Site Updates

concurrency:
  group: plant-matrix-site-updates
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    paths-ignore:
      - sitemap.xml
      - index.html
      - feed.xml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # --- TASK 1: CANONICAL PATCH ---
      - name: Run Auto-Canonical Script
        run: |
          if [ -f auto_canonical.py ]; then
            python auto_canonical.py
          else
            echo "auto_canonical.py not found, skipping."
          fi

      # --- TASK 2: AUTO LINK BUILDER & CLEANER ---
      - name: Execute Link Rebuilder
        run: |
          if [ -f auto_linker.py ]; then
            python auto_linker.py
          else
            echo "auto_linker.py not found, skipping."
          fi

      # --- TASK 3: ADSENSE ARCHITECTURE ---
      - name: Add Google AdSense code to HTML pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ADSENSE_CODE = '<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6258569726732185" crossorigin="anonymous"></script>'
          PUBLISHER_ID = "ca-pub-6258569726732185"

          for file in Path(".").rglob("*.html"):
              if ".git" in file.parts:
                  continue

              content = file.read_text(encoding="utf-8")

              if PUBLISHER_ID in content:
                  print(f"AdSense already present: {file}")
                  continue

              if "<head>" not in content:
                  print(f"Skipped: {file} — no <head> tag found")
                  continue

              content = content.replace(
                  "<head>",
                  "<head>\n    " + ADSENSE_CODE,
                  1
              )

              file.write_text(content, encoding="utf-8")
              print(f"Added AdSense code: {file}")
          PY

      # --- TASK 4: SITEMAP & HOMEPAGE UPDATE ---
      - name: Generate sitemap and homepage
        shell: bash
        run: |
          set -euo pipefail

          TODAY="$(date -u +'%Y-%m-%d')"

          {
            printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>'
            printf '%s\n' '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
            printf '%s\n' '  <url>'
            printf '%s\n' '    <loc>https://theplantmatrix.com/</loc>'
            printf '    <lastmod>%s</lastmod>\n' "$TODAY"
            printf '%s\n' '    <changefreq>daily</changefreq>'
            printf '%s\n' '    <priority>1.0</priority>'
            printf '%s\n' '  </url>'
          } > sitemap.xml

          rm -f links.tmp
          touch links.tmp

          find . -type f -name "*.html" \
            ! -name "index.html" \
            ! -path "./.git/*" | sort | while IFS= read -r file
          do
            RELATIVE_PATH="${file#./}"
            URL_PATH="${RELATIVE_PATH%.html}"
            LASTMOD="$(date -u -r "$file" +'%Y-%m-%d')"

            {
              printf '%s\n' '  <url>'
              printf '    <loc>https://theplantmatrix.com/%s</loc>\n' "$URL_PATH"
              printf '    <lastmod>%s</lastmod>\n' "$LASTMOD"
              printf '%s\n' '    <changefreq>monthly</changefreq>'
              printf '%s\n' '    <priority>0.8</priority>'
              printf '%s\n' '  </url>'
            } >> sitemap.xml

            if [[ "$RELATIVE_PATH" != */* ]]; then
              FILE="$(basename "$file")"

              TITLE=$(echo "$FILE" \
                | sed 's/\.html$//' \
                | sed 's/-/ /g' \
                | awk '{for(i=1;i<=NF;i++) $i=toupper(substr($i,1,1)) substr($i,2)}1')

              printf '    <li><a href="/%s">%s</a></li>\n' \
                "${FILE%.html}" "$TITLE" >> links.tmp
            fi
          done

          printf '%s\n' '</urlset>' >> sitemap.xml

          awk '
          /<!-- START_ARTICLE_LIST -->/ {
              print
              while ((getline line < "links.tmp") > 0)
                  print line
              close("links.tmp")
              skip=1
              next
          }

          /<!-- END_ARTICLE_LIST -->/ {
              skip=0
              print
              next
          }

          !skip
          ' index.html > index.new

          mv index.new index.html
          rm -f links.tmp

      # --- TASK 5: AUTO GENERATE RSS FEED ---
      - name: Run Feed Builder
        run: |
          if [ -f "generate_feed .py" ]; then
            python "generate_feed .py"
          elif [ -f generate_feed.py ]; then
            python generate_feed.py
          else
            echo "RSS script not found, skipping."
          fi

      # --- FINAL STEP: COMBINED COMMIT AND PUSH ---
      - name: Commit and Push Changes Safely
        shell: bash
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Automated build: updates to sitemap, homepage, links, and rss feed [skip ci]"
            git pull origin main --rebase
            git push origin main
          else
            echo "No site or asset changes detected. Skipping push."
          fi
