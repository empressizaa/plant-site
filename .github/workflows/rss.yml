name: Generate RSS Feed

on:
push:
branches:
- main
paths:
- "*.html"
paths-ignore:
- "feed.xml"
- "index.html"

workflow_dispatch:

permissions:
contents: write

jobs:
generate-rss:
runs-on: ubuntu-latest

steps:
- name: Checkout repository
uses: actions/checkout@v4
with:
fetch-depth: 0

- name: Generate feed.xml
shell: bash
run: |
set -euo pipefail

NOW="$(date -u +"%a, %d %b %Y %H:%M:%S GMT")"

{
echo '<?xml version="1.0" encoding="UTF-8"?>'
echo '<rss version="2.0">'
echo '<channel>'
echo '<title>The Plant Matrix</title>'
echo '<link>https://theplantmatrix.com/</link>'
echo '<description>Comprehensive plant watering and care guides.</description>'
echo "<lastBuildDate>${NOW}</lastBuildDate>"

find . -maxdepth 1 -name "*.html" ! -name "index.html" | sort | while read file
do
FILE=$(basename "$file")
URL="https://theplantmatrix.com/$FILE"

TITLE=$(grep -oPm1 '(?<=<title>)[^<]+' "$file" || true)
DESC=$(grep -oPm1 '(?<=<meta name="description" content=")[^"]+' "$file" || true)
DATE=$(git log -1 --format="%aD" -- "$file" || true)

[ -z "$TITLE" ] && TITLE="${FILE%.html}"
[ -z "$DESC" ] && DESC="$TITLE"
[ -z "$DATE" ] && DATE="$NOW"

echo "<item>"
echo "<title><![CDATA[$TITLE]]></title>"
echo "<link>$URL</link>"
echo "<guid>$URL</guid>"
echo "<pubDate>$DATE</pubDate>"
echo "<description><![CDATA[$DESC]]></description>"
echo "</item>"
done

echo '</channel>'
echo '</rss>'
} > feed.xml

- name: Commit feed.xml
run: |
git config user.name "github-actions[bot]"
git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

git add feed.xml

if git diff --cached --quiet; then
echo "No changes."
exit 0
fi

git commit -m "Auto-update RSS feed"
git push
