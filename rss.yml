name: Generate RSS Feed

on:
  push:
    branches:
      - main
    paths:
      - "*.html"
    paths-ignore:
      - "index.html"
      - "feed.xml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-rss:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate feed.xml
        shell: bash
        run: |
          set -euo pipefail

          NOW="$(date -u +"%a, %d %b %Y %H:%M:%S GMT")"

          cat > feed.xml <<EOF
<?xml version="1.0" encoding="UTF-8"?>
<rss version="2.0" xmlns:atom="http://www.w3.org/2005/Atom">
<channel>
<title>The Plant Matrix</title>
<link>https://theplantmatrix.com/</link>
<description>Plant care and watering guides.</description>
<language>en-us</language>
<lastBuildDate>${NOW}</lastBuildDate>
<atom:link href="https://theplantmatrix.com/feed.xml" rel="self" type="application/rss+xml"/>
EOF

          find . -maxdepth 1 -type f -name "*.html" ! -name "index.html" | while read file
          do
            FILE=$(basename "$file")
            URL="https://theplantmatrix.com/$FILE"
            TITLE=$(grep -oPm1 '(?<=<title>)[^<]+' "$file" || true)
            DESCRIPTION=$(grep -oPm1 '(?<=<meta name="description" content=")[^"]+' "$file" || true)
            PUBDATE=$(git log -1 --format="%aD" -- "$file")

            [ -z "$TITLE" ] && TITLE="${FILE%.html}"
            [ -z "$DESCRIPTION" ] && DESCRIPTION="$TITLE"
            [ -z "$PUBDATE" ] && PUBDATE="$NOW"

cat >> feed.xml <<EOF
<item>
<title><![CDATA[$TITLE]]></title>
<link>$URL</link>
<guid isPermaLink="true">$URL</guid>
<pubDate>$PUBDATE</pubDate>
<description><![CDATA[$DESCRIPTION]]></description>
</item>
EOF
          done

cat >> feed.xml <<EOF
</channel>
</rss>
EOF

      - name: Commit feed.xml
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add feed.xml

          if git diff --cached --quiet; then
            echo "No RSS changes."
            exit 0
          fi

          git commit -m "Auto-update RSS feed"
          git push
