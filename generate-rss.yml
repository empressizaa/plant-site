name: Auto Generate RSS Feed

on:
  push:
    branches:
      - main # Triggers whenever you upload new content files

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Run Feed Builder
      run: python generate_feed.py

    - name: Commit and Push Updated Feed
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add feed.xml
        git commit -m "Automated update to feed.xml" || exit 0
        git push
